    <script>
      // Self-healing cache purge & error diagnostics script
      (function() {
        var RECOVERY_KEY = 'ittybittybites-recovery-attempt';
        function forceClearCachesAndReload() {
          try {
            var last = parseInt(localStorage.getItem(RECOVERY_KEY) || '0', 10);
            var now = Date.now();
            if (now - last < 2 * 60 * 1000) return;
            localStorage.setItem(RECOVERY_KEY, String(now));
          } catch (err) {}

          console.warn('ITTYBITTYBITES: Clearing Service Worker and CacheStorage...');
          function doReload() { window.location.reload(true); }

          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              return Promise.all(regs.map(function(r) { return r.unregister(); }));
            }).then(function() {
              if ('caches' in window) {
                return caches.keys().then(function(keys) {
                  return Promise.all(keys.map(function(k) { return caches.delete(k); }));
                });
              }
            }).then(doReload).catch(doReload);
          } else if ('caches' in window) {
            caches.keys().then(function(keys) {
              return Promise.all(keys.map(function(k) { return caches.delete(k); }));
            }).then(doReload).catch(doReload);
          } else {
            doReload();
          }
        }

        window.addEventListener('error', function(e) {
          var isScriptError = e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK');
          var msg = e.message || '';
          if (isScriptError || msg.includes('ChunkLoadError') || msg.includes('Failed to fetch') || msg.includes('SyntaxError') || msg.includes('Unexpected token')) {
            forceClearCachesAndReload();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          forceClearCachesAndReload();
        });
      })();
    </script>
