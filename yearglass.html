<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>YearGlass — a living digital sanctuary</title>
    <meta name="description" content="A living world that grows with you. A tiny ecosystem. A lifetime of memories." />
    <!-- Critical Inline Styles for Immediate High-Contrast & Mobile Viewport Override -->
    <style>
      /* Allow standard document flow on body */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
      }
      /* Lock containment strictly to the game container/canvas */
      #app, #root, #yearglass-mount, .game-container, .yearglass-mount, canvas {
        width: 100% !important;
        height: 100dvh !important;
        max-height: 100dvh !important;
        overflow: hidden !important;
        touch-action: none;
      }
      [class*="card"], [class*="dialogue"], [class*="popup"] {
        background-color: #f7f2ea !important;
        color: #111111 !important;
      }
      [class*="card"] *, [class*="dialogue"] * {
        color: #111111 !important;
        -webkit-text-fill-color: #111111 !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/yearglass/main.ts"></script>
    <script type="module" src="/version-check.js"></script>
  </body>
</html>
