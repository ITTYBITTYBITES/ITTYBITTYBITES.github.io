<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 180" width="336" height="504">
  <defs>
    <linearGradient id="batNight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0E28"/>
      <stop offset="100%" stop-color="#06040A"/>
    </linearGradient>
    <linearGradient id="batAmethyst" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C39BD3"/>
      <stop offset="55%" stop-color="#6C3483"/>
      <stop offset="100%" stop-color="#2C1040"/>
    </linearGradient>
    <linearGradient id="batCobalt" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5DADE2"/>
      <stop offset="100%" stop-color="#0E2F56"/>
    </linearGradient>
    <linearGradient id="batAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8C471"/>
      <stop offset="100%" stop-color="#B7650C"/>
    </linearGradient>
    <linearGradient id="batRuby" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E74C3C"/>
      <stop offset="100%" stop-color="#641E16"/>
    </linearGradient>
    <linearGradient id="batSmoke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#85929E"/>
      <stop offset="100%" stop-color="#1B2631"/>
    </linearGradient>
    <linearGradient id="batMoon" x1="30%" y1="20%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFF6E0"/>
      <stop offset="45%" stop-color="#FFC49B"/>
      <stop offset="100%" stop-color="#C86432"/>
    </linearGradient>
    <radialGradient id="batGlow" cx="32%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#FFC49B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#09060E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Card night glass -->
  <rect x="4" y="4" width="112" height="172" rx="8" fill="url(#batNight)" stroke="#C86432" stroke-width="2.6"/>
  <rect x="8" y="8" width="104" height="164" rx="5" fill="none" stroke="#7A3617" stroke-width="0.8" opacity="0.7"/>
  <rect x="4" y="4" width="112" height="172" rx="8" fill="url(#batGlow)"/>

  <!-- Background foil shards -->
  <path d="M 10 14 L 58 10 L 52 46 L 10 52 Z" fill="#1B4F72" stroke="#C86432" stroke-width="1.4"/>
  <path d="M 110 14 L 62 10 L 68 46 L 110 50 Z" fill="#4A235A" stroke="#C86432" stroke-width="1.4"/>
  <path d="M 10 166 L 54 170 L 50 132 L 10 128 Z" fill="#4A235A" stroke="#C86432" stroke-width="1.4"/>
  <path d="M 110 166 L 66 170 L 70 132 L 110 128 Z" fill="#1B4F72" stroke="#C86432" stroke-width="1.4"/>

  <!-- Moon, tucked so the angled bat can cross it -->
  <circle cx="34" cy="40" r="16" fill="url(#batMoon)" stroke="#C86432" stroke-width="1.8"/>
  <path d="M 34 24 L 34 56 M 18 40 L 50 40 M 23 29 L 45 51 M 45 29 L 23 51" stroke="#FFC49B" stroke-width="0.7" opacity="0.55"/>

  <!-- Angled stained-glass bat — rotated to fill the tall card -->
  <g transform="translate(60,96) rotate(-38) translate(-60,-90)">
    <!-- Left wing membrane panes -->
    <path d="M 58 78 L 18 52 L 8 70 L 22 78 L 12 92 L 28 88 L 22 108 L 42 92 L 52 86 Z" fill="url(#batAmethyst)" stroke="#C86432" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 52 86 L 28 88 L 22 108 L 42 92 Z" fill="url(#batCobalt)" stroke="#C86432" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M 58 78 L 18 52 L 22 78 Z" fill="url(#batRuby)" stroke="#C86432" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M 22 78 L 12 92 L 28 88 Z" fill="url(#batSmoke)" stroke="#C86432" stroke-width="1.15" stroke-linejoin="round"/>

    <!-- Right wing membrane panes -->
    <path d="M 62 78 L 102 52 L 112 70 L 98 78 L 108 92 L 92 88 L 98 108 L 78 92 L 68 86 Z" fill="url(#batAmethyst)" stroke="#C86432" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 68 86 L 92 88 L 98 108 L 78 92 Z" fill="url(#batCobalt)" stroke="#C86432" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M 62 78 L 102 52 L 98 78 Z" fill="url(#batRuby)" stroke="#C86432" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M 98 78 L 108 92 L 92 88 Z" fill="url(#batSmoke)" stroke="#C86432" stroke-width="1.15" stroke-linejoin="round"/>

    <!-- Body -->
    <path d="M 60 72 L 70 86 L 66 112 L 60 122 L 54 112 L 50 86 Z" fill="url(#batSmoke)" stroke="#C86432" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M 56 90 L 64 90 L 62 110 L 58 110 Z" fill="url(#batAmber)" stroke="#C86432" stroke-width="1.1"/>

    <!-- Head + ears -->
    <path d="M 52 62 L 48 46 L 56 56 L 60 50 L 64 56 L 72 46 L 68 62 L 60 70 Z" fill="url(#batAmethyst)" stroke="#C86432" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="56.5" cy="62" r="2.1" fill="url(#batAmber)" stroke="#FFC49B" stroke-width="0.6"/>
    <circle cx="63.5" cy="62" r="2.1" fill="url(#batAmber)" stroke="#FFC49B" stroke-width="0.6"/>

    <!-- Tiny feet -->
    <path d="M 54 120 L 52 128 L 56 124 L 60 128 L 64 124 L 68 128 L 66 120" fill="none" stroke="#C86432" stroke-width="1.3" stroke-linejoin="round"/>
  </g>
</svg>
