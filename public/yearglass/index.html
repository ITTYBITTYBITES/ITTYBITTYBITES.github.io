    <button onclick="initAudio(); unlockAudio(); const el=document.createElement('div');el.style.cssText='position:fixed;inset:0;z-index:9999;background:linear-gradient(135deg,#0d0d0e 0%,#1a1814 60%,#0a1a1a 100%);color:#f0ede8;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,sans-serif;animation:fadeIn 0.8s ease';el.innerHTML='<style>@keyframes fadeIn{from{opacity:0;transform:scale(0.92)}to{opacity:1;transform:scale(1)}}</style><div style=text-align:center;padding:2rem;max-width:720px;animation:reveal 1.2s ease-out;><h2 style=font-size:2rem;margin-bottom:1rem;color:#bfa06a;>The Dome Opens</h2><p style=font-size:1.125rem;line-height:1.6;opacity:0.9;margin-bottom:1.5rem;>The glass breathes. Inside, water holds light. Plants bow slowly.</p><button onclick=\'this.closest(\'[style*=z-index]\').remove()\' style=padding:0.75rem 1.5rem;border-radius:8px;border:1px solid #bfa06a;background:#bfa06a;color:#0d0d0e;font-weight:700;cursor:pointer;>Return</button></div>';document.body.appendChild(el);" style="position:fixed;bottom:2rem;right:2rem;z-index:100;padding:0.75rem 1.5rem;background:#bfa06a;color:#0d0d0e;border:none;border-radius:8px;font-weight:700;cursor:pointer;box-shadow:0 8px 24px rgba(191,160,106,0.25);">Enter Focus Mode</button>
    <script>function initAudio(){try{window.audioCtx=new(window.AudioContext||window.webkitAudioContext)();console.log('Audio init')}catch(e){}}function unlockAudio(){if(window.audioCtx&&window.audioCtx.state==='suspended'){window.audioCtx.resume();console.log('Audio unlocked')}}function playTone(f,d,v){if(!window.audioCtx)return;try{const o=window.audioCtx.createOscillator();const g=window.audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(f||440,window.audioCtx.currentTime);g.gain.setValueAtTime(v||0.15,window.audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.01,window.audioCtx.currentTime+(d||0.2));o.connect(g);g.connect(window.audioCtx.destination);o.start();o.stop(window.audioCtx.currentTime+(d||0.2))}catch(e){console.error('Audio play error',e)}}</script>
